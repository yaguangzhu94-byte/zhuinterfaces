  headline: "A new chapter at Texas Tech"
  summary: >-
    The Zhu Interfaces Lab launches at Texas Tech University, bringing
    interfacial design and advanced characterization together to understand
    materials and processes under real working conditions.
  body: >-
    On January 12, 2026, Dr. Yaguang Zhu joined Texas Tech University’s
    Department of Civil, Environmental & Construction Engineering (CECE) and
    the Institute for Sustainability and Circular Economy (ISCE). The lab is
    building a research program that reveals how interfaces govern transport
    and transformations across materials, electrochemical devices, and
    sustainable systems.
