<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500" role="img" aria-label="Multiscale Zhu Lab research from molecular interactions to confined interfaces, material structure, devices, sustainable systems, and synchrotron X-ray characterization">
<defs>
