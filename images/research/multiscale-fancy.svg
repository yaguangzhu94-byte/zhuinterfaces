<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="530" viewBox="0 0 1150 530" role="img" aria-labelledby="title desc">
  <title id="title">Multiscale Zhu Lab research</title>
  <desc id="desc">Research spanning molecular interactions, confined interfaces, material structure, electrochemical devices, sustainable systems, and operando synchrotron X-ray characterization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f0"/>
      <stop offset="1" stop-color="#eef3f1"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97a5d" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#d97a5d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f2b27d" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1c2927" flood-opacity="0.10"/>
    </filter>
    <style>
      .label{font:700 14px Arial,sans-serif;letter-spacing:1.7px;fill:#2d7771}
      .small{font:400 13px Arial,sans-serif;fill:#6b6b66}
      .node{fill:#fff;stroke:#d8d8d1;stroke-width:1.2}
      .line{fill:none;stroke:#9abbb6;stroke-width:2.3}
    </style>
  </defs>

  <rect width="1150" height="530" rx="18" fill="url(#bg)"/>
  <path d="M88 276 C240 164 375 164 522 262 C664 357 820 352 1058 224" fill="none" stroke="#2d7771" stroke-opacity="0.18" stroke-width="38" stroke-linecap="round"/>
  <path d="M88 276 C240 164 375 164 522 262 C664 357 820 352 1058 224" fill="none" stroke="#2d7771" stroke-width="2.4" stroke-dasharray="5 9"/>

  <!-- molecular scale -->
  <g transform="translate(64 162)" filter="url(#shadow)">
    <rect class="node" width="198" height="190" rx="18"/>
    <text class="label" x="22" y="30">MOLECULAR</text>
    <g transform="translate(98 91)">
      <line x1="-47" y1="-10" x2="-14" y2="5" stroke="#6c6aa0" stroke-width="5"/>
      <line x1="-14" y1="5" x2="19" y2="-31" stroke="#6c6aa0" stroke-width="5"/>
      <line x1="-14" y1="5" x2="31" y2="29" stroke="#6c6aa0" stroke-width="5"/>
      <line x1="31" y1="29" x2="62" y2="1" stroke="#6c6aa0" stroke-width="5"/>
      <circle cx="-47" cy="-10" r="15" fill="#d97a5d"/>
      <circle cx="-14" cy="5" r="18" fill="#7775a8"/>
      <circle cx="19" cy="-31" r="13" fill="#a9c9c3"/>
      <circle cx="31" cy="29" r="16" fill="#2d7771"/>
      <circle cx="62" cy="1" r="12" fill="#d97a5d"/>
    </g>
    <text class="small" x="22" y="161">Solvation · ion interactions</text>
  </g>

  <!-- confined interface -->
  <g transform="translate(286 98)" filter="url(#shadow)">
    <rect class="node" width="220" height="230" rx="18"/>
    <text class="label" x="22" y="30">CONFINED INTERFACE</text>
    <g transform="translate(20 58)">
      <path d="M0 15 C50 -3 126 28 180 8 L176 34 C122 50 48 21 3 41 Z" fill="#b7d6d0" stroke="#2d7771" stroke-width="3"/>
      <path d="M0 74 C50 56 126 87 180 67 L176 93 C122 109 48 80 3 100 Z" fill="#b7d6d0" stroke="#2d7771" stroke-width="3"/>
      <path d="M0 133 C50 115 126 146 180 126 L176 152 C122 168 48 139 3 159 Z" fill="#b7d6d0" stroke="#2d7771" stroke-width="3"/>
      <circle cx="52" cy="57" r="8" fill="#7775a8"/><circle cx="99" cy="53" r="7" fill="#d97a5d"/><circle cx="143" cy="58" r="6" fill="#a9c9c3"/>
      <circle cx="74" cy="116" r="7" fill="#d97a5d"/><circle cx="126" cy="112" r="8" fill="#7775a8"/>
    </g>
    <text class="small" x="22" y="205">2D channels · hydration</text>
  </g>

  <!-- material structure -->
  <g transform="translate(532 180)" filter="url(#shadow)">
    <rect class="node" width="205" height="205" rx="18"/>
    <text class="label" x="22" y="30">STRUCTURE</text>
    <g transform="translate(102 104)">
      <polygon points="0,-56 49,-28 49,28 0,56 -49,28 -49,-28" fill="#eef5f3" stroke="#2d7771" stroke-width="3"/>
      <line x1="-49" y1="-28" x2="49" y2="28" class="line"/><line x1="49" y1="-28" x2="-49" y2="28" class="line"/><line x1="0" y1="-56" x2="0" y2="56" class="line"/>
      <circle cx="0" cy="0" r="10" fill="#d97a5d"/><circle cx="0" cy="-56" r="8" fill="#7775a8"/><circle cx="49" cy="-28" r="8" fill="#7775a8"/><circle cx="49" cy="28" r="8" fill="#7775a8"/><circle cx="0" cy="56" r="8" fill="#7775a8"/><circle cx="-49" cy="28" r="8" fill="#7775a8"/><circle cx="-49" cy="-28" r="8" fill="#7775a8"/>
    </g>
    <text class="small" x="22" y="181">Phases · morphology</text>
  </g>

  <!-- device -->
  <g transform="translate(764 120)" filter="url(#shadow)">
    <rect class="node" width="190" height="205" rx="18"/>
    <text class="label" x="22" y="30">DEVICE</text>
    <g transform="translate(25 61)">
      <rect x="0" y="15" width="22" height="95" rx="4" fill="#555954"/>
      <rect x="24" y="23" width="92" height="79" rx="7" fill="#dcece8" stroke="#2d7771" stroke-width="2"/>
      <rect x="67" y="23" width="7" height="79" fill="#2d7771" opacity=".8"/>
      <rect x="118" y="15" width="22" height="95" rx="4" fill="#555954"/>
      <circle cx="45" cy="45" r="5" fill="#d97a5d"/><circle cx="92" cy="72" r="5" fill="#7775a8"/><circle cx="47" cy="84" r="4" fill="#7775a8"/>
    </g>
    <text class="small" x="22" y="181">Electrochemical systems</text>
  </g>

  <!-- sustainable systems -->
  <g transform="translate(974 204)" filter="url(#shadow)">
    <rect class="node" width="132" height="174" rx="18"/>
    <text class="label" x="18" y="30">SYSTEMS</text>
    <g transform="translate(66 87)">
      <path d="M0 43 C-28 13 -36 -13 -9 -42 C8 -18 12 6 0 43 Z" fill="#2d7771" opacity=".88"/>
      <path d="M2 42 C17 10 29 -11 49 -19 C51 8 31 33 2 42 Z" fill="#a9c9c3"/>
      <path d="M0 41 C2 14 -4 -9 -9 -31" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <text class="small" x="18" y="151">Water · resources</text>
  </g>

  <!-- synchrotron beam and detector -->
  <g>
    <path d="M470 438 L906 438 L906 470 L470 470 Z" fill="url(#beam)"/>
    <polygon points="470,454 500,440 500,468" fill="#d97a5d" opacity=".9"/>
    <circle cx="912" cy="454" r="45" fill="#fff" stroke="#d9d8d1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="912" cy="454" r="31" fill="none" stroke="#7775a8" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="912" cy="454" r="8" fill="#2d7771"/>
    <text class="label" x="522" y="425">OPERANDO SYNCHROTRON X-RAYS</text>
    <text class="small" x="522" y="493">connect structure, transport, and function across scales</text>
  </g>
</svg>
