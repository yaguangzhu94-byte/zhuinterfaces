<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Texas Tech campus illustration</title>
  <desc id="desc">An original architectural illustration inspired by Memorial Circle and the Administration Building at Texas Tech University.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cacae"/>
      <stop offset="0.55" stop-color="#e8d9c4"/>
      <stop offset="1" stop-color="#f2d3ad"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#697b60"/>
      <stop offset="1" stop-color="#2f433a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5d7c1"/>
      <stop offset="1" stop-color="#bda98e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1c241f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
