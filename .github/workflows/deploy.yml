name: Build and Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Prepare optimized images
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          def reconstruct(chunk_paths, target, expected_sha256, replacements=None):
              replacements = replacements or {}
              chunks = []

              for path in chunk_paths:
                  text = path.read_text(encoding="utf-8").strip()
                  for old, new in replacements.get(path.name, []):
                      text = text.replace(old, new)
                  chunks.append(text)

              encoded = "".join(chunks)
              image_bytes = base64.b64decode(encoded, validate=True)
              actual_sha256 = hashlib.sha256(image_bytes).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise RuntimeError(
                      f"Image verification failed for {target}: {actual_sha256}"
                  )

              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(image_bytes)
              print(
                  f"Prepared {target} "
                  f"({len(image_bytes):,} bytes; SHA-256 verified)"
              )

          bnl_root = Path("images/News/2026/07/_source/20260724_BNL_HEX_hd")
          reconstruct(
              [
                  bnl_root / "part-00.txt",
                  bnl_root / "part-01.txt",
                  bnl_root / "part-02.txt",
                  bnl_root / "part-03.txt",
                  bnl_root / "correct-04.txt",
                  bnl_root / "part-05.txt",
                  bnl_root / "part-06.txt",
                  bnl_root / "part-07.txt",
                  bnl_root / "correct-08.txt",
                  bnl_root / "correct-09.txt",
              ],
              Path("images/News/2026/07/20260724_BNL_HEX_beamtime.webp"),
              "99259ad0d531fe7829af0d4b7e48681469addfcfa50f9d4b761f128421065dd2",
              {"part-03.txt": [("OvavaidQo8", "OvmaidQo8")]},
          )

          group_root = Path("images/News/2026/08/_source/20260824_Zhu_Lab_Group")
          reconstruct(
              [group_root / f"part-{index:02d}.txt" for index in range(10)],
              Path("images/News/2026/08/20260824_Zhu_Lab_Group.webp"),
              "d242d6d2ab2b6cf26457ab6ea302d4d442b42c9bd55116f830a9b8ec7010a7a9",
          )

          rylee_root = Path("images/team/rylee-young-data")
          reconstruct(
              [
                  rylee_root / "part-00.txt",
                  rylee_root / "part-01.txt",
                  rylee_root / "part-02.txt",
                  rylee_root / "part-03.txt",
              ],
              Path("images/team/rylee-young.webp"),
              "f16b3fc015271f1b3b67f84e1b4fca22544bb16aaf35fb251f60073b9d66b3a2",
          )
          PY

      - name: Commit August group photo
        run: |
          image="images/News/2026/08/20260824_Zhu_Lab_Group.webp"
          if git ls-files --error-unmatch "$image" >/dev/null 2>&1 && git diff --quiet -- "$image"; then
            echo "August group photo is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$image"
          git commit -m "Add August 2026 Zhu Lab group photo"
          git push origin HEAD:source

      - name: Build site
        run: |
          # _config_demo.yml is only for the upstream demo site — ignore it in forks/copies
          if [ -f _config_demo.yml ] && [ "$GITHUB_REPOSITORY" = "sbryngelson/academic-website-template" ]; then
            bundle exec jekyll build --config _config.yml,_config_demo.yml
          else
            bundle exec jekyll build
          fi
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
